server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index student.html;
  client_max_body_size 500m;

  location /api/ {
    proxy_pass http://yanban-api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location = / {
    try_files /student.html =404;
  }

  # Only the two application pages, subject catalog, and bundled assets are
  # public. Every other path is denied rather than falling through to root.
  location = /student.html { try_files $uri =404; }
  location = /teacher.html { try_files $uri =404; }
  location = /subject_directory.js { try_files $uri =404; }
  location ^~ /assets/ { try_files $uri =404; }

  location ~* \.(?:py|pyc|md|txt|log|env|db|sqlite3|sqlite3-wal|sqlite3-shm)$ {
    deny all;
  }
  location ~* /(?:data|logs|deploy)(?:/|$) {
    deny all;
  }
  location ~* /(?:Dockerfile(?:\.[^/]*)?|docker-compose[^/]*\.ya?ml|\.dockerignore|\.gitignore)(?:$|/) {
    deny all;
  }
  location / {
    return 404;
  }
}
