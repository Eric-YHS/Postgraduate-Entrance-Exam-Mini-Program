name: Deploy to Server

# 代码质量检查在 ci.yml 里；这条工作流只负责「把已经绿过的提交推到服务器」。
# 之前测试和部署挤在同一条 push 触发的工作流里：服务器缺 .env、SSH 抖动这类
# 纯运维问题会把 npm test 也标成红叉，PR 上看不出到底是哪里坏了。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # 服务器上手工改过配置、或者需要把已经部署过的提交再重启一次时用这个
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    # 手工触发时 github.event.workflow_run 是空的，所以两种触发方式分开判断。
    # workflow_run 只会看 CI 的结论，不会重复跑测试；event/branch 判断是为了排除
    # 由 PR 触发的那次 CI 运行（PR 还没合就部署会把 main 之外的代码推上线）。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # 部署曾经会在 rsync 这一步挂住几个小时：链路半死时 TCP 连接不会自己报错，
    # 而一个卡住的 deploy 又会让后面所有提交排队，所以同时设置任务超时、
    # rsync 空闲超时与 ssh 保活探测，并让部署串行执行（不在传输中途被取消）
    timeout-minutes: 20
    concurrency:
      group: kaoyan-deploy
      cancel-in-progress: false
    steps:
      - name: Resolve target commit
        id: target
        # workflow_run 触发时 Runner 默认检出的是「触发它的那次运行」的仓库快照，
        # 而不是 main；不显式锁 SHA 就可能部署到比被测提交更新的 HEAD，
        # 那部分代码是没跑过测试的。
        env:
          run_sha: ${{ github.event.workflow_run.head_sha }}
          dispatch_sha: ${{ github.sha }}
        run: |
          sha="${run_sha:-$dispatch_sha}"
          test -n "$sha" || { echo "无法确定要部署的提交"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "将部署提交 $sha（触发方式 ${{ github.event_name }}）"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Check secrets are set
        run: |
          echo "SERVER_HOST length: ${#SERVER_HOST}"
          echo "SERVER_USER length: ${#SERVER_USER}"
          echo "SERVER_SSH_KEY length: ${#SERVER_SSH_KEY}"
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

      - name: Setup SSH config
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host deploy-server
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF
          printf '159.75.67.99 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM35P0tSfcOjdr9wvXq9C7IkGjwrKs1gxI3RTvUkYQTJ\n' > ~/.ssh/known_hosts
          ls -la ~/.ssh/
          echo '--- config ---'
          cat ~/.ssh/config
          echo '--- key head ---'
          head -n 1 ~/.ssh/deploy_key
          echo '--- known_hosts ---'
          cat ~/.ssh/known_hosts
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

      - name: Test SSH connection
        run: ssh deploy-server "echo 'SSH connection OK'"

      # 服务器上的 .env 一旦被误删，部署会永远卡在那道 .env 检查上，而没有 SSH
      # 权限的人完全无法推进（实际就碰上过：仓库侧什么都错了，但只有服务器少了一个文件）。
      # 配了可选的 SERVER_DOTENV secret 时，这里做一次「只在文件缺失时」的兑底重建；
      # 没配就什么都不做，行为跟以前完全一致。后面的 SESSION_SECRET 长度校验会接着把关，
      # 重建内容不对也不会带病重启。
      - name: Rebuild server .env from secret when missing
        env:
          SERVER_DOTENV: ${{ secrets.SERVER_DOTENV }}
        run: |
          APP_DIR=/home/ubuntu/kaoyan-xiaochengxu
          if ssh deploy-server "test -f $APP_DIR/.env"; then
            echo "服务器已有 .env，跳过重建（这一步只在文件缺失时兑底）"
            exit 0
          fi
          if [ -z "$SERVER_DOTENV" ]; then
            echo "服务器缺 $APP_DIR/.env，且未配置 SERVER_DOTENV secret，继续让部署脚本按原逻辑报错"
            exit 0
          fi
          printf '%s\n' "$SERVER_DOTENV" | ssh deploy-server "umask 077 && cat > $APP_DIR/.env && wc -l < $APP_DIR/.env"
          echo "已从 SERVER_DOTENV 重建 .env（只写了变量名对应的行，未回显任何值）"

      - name: Sync checked-out revision to server
        run: |
          APP_DIR=/home/ubuntu/kaoyan-xiaochengxu
          ssh deploy-server "test \"\$(readlink -f '$APP_DIR')\" = '$APP_DIR'"
          # related-projects/ 仅用于归档参考（其中 wechat-ai-assistant 就占 298MB），
          # 服务端运行与测试都不读取它；以前每次部署都要把它重传一遍，
          # 一个几秒钟的同步能跑上特别久，所以这里直接排除。
          # --timeout=300：传输 5 分钟没有进展就失败退出，避免永久挂起
          # 注意这里没有用 --delete：服务端的数据文件、上传目录等要保留，
          # 代价是仓库里删掉的文件不会自动从服务器上消失
          rsync -az --stats --timeout=300 \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.backup' \
            --exclude='.cache/' \
            --exclude='.playwright-mcp/' \
            --exclude='backups/' \
            --exclude='data/' \
            --exclude='data.sqlite' \
            --exclude='data.sqlite-shm' \
            --exclude='data.sqlite-wal' \
            --exclude='node_modules/' \
            --exclude='miniprogram/node_modules/' \
            --exclude='public/uploads/' \
            --exclude='private.*.key' \
            --exclude='wechat-platform-login*.png' \
            --exclude='related-projects/' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite-shm' \
            --exclude='*.sqlite-wal' \
            -e ssh ./ "deploy-server:$APP_DIR/"

      - name: Deploy via SSH
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          ssh deploy-server "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTESCRIPT'
          set -e

          # 加载 nvm 环境（服务器使用 nvm 管理 Node）
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          command -v node && command -v npm && command -v pm2

          APP_DIR=/home/ubuntu/kaoyan-xiaochengxu
          BACKUP_DIR=$APP_DIR/backups
          test "$(readlink -f "$APP_DIR")" = "$APP_DIR"
          cd $APP_DIR

          # 备份环境变量
          # .env 是 rsync 显式排除的，只存在于服务器上；丢了就直接退，
          # 不要带着一堆 undefined 配置重启线上进程（上一次部署只留了一句
          # "cp: cannot stat '.env'"，看不出是于没文件还是目录不对）
          if [ ! -f .env ]; then
            echo "缺少 $APP_DIR/.env，终止部署（该文件不由 rsync 同步，只在服务器上）"
            ls -la "$APP_DIR" | head -30
            [ -f .env.backup ] && echo "检测到 .env.backup，可用它人工恢复"
            echo "也可以配置仓库 secret SERVER_DOTENV，下次部署会自动重建（见 docs/GitHub自动部署配置指南.md）"
            exit 1
          fi
          cp .env .env.backup
          chmod 600 .env .env.backup

          # ecosystem.config.cjs 默认使 env（NODE_ENV=development），而 config.js 只在
          # NODE_ENV=production 时才强校验 SESSION_SECRET：密钥缺失时进程会用一个随机
          # 密钥启起来，重启就全体掉线而且现场没有任何提示。这里在动线上进程之前先把
          # 这道关卡补上（npm start 的 --env-file-if-exists 同理，文件不在也不会报错）
          node -e '
            const fs = require("fs");
            const lines = fs.readFileSync(".env", "utf8").split("\n");
            let value = "";
            for (const raw of lines) {
              const line = raw.trim();
              if (line.startsWith("SESSION_SECRET=")) {
                // \x27 是单引号：这段整体写在 shell 的单引号里，不能出现字面单引号
                value = line.slice("SESSION_SECRET=".length).trim().replace(/^[\x27"]|[\x27"]$/g, "");
              }
            }
            if (value.length < 32) {
              console.error("FATAL: .env 里的 SESSION_SECRET 缺失或短于 32 字符（当前 " + value.length + "），终止部署");
              console.error("用 npm run generate-secret 生成后戒到服务器上的 .env 里");
              process.exit(1);
            }
            console.log("SESSION_SECRET 长度校验通过");
          '

          # 标记本次由 Runner 同步的精确提交；服务健康接口会回传该值。
          printf '%s\n' "$DEPLOY_SHA" > .deploy-sha
          rm -f .content-security-verified

          # 部署前备份 SQLite 数据库
          mkdir -p $BACKUP_DIR
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          DB_PATH=$(grep '^DB_PATH=' .env | tail -n 1 | cut -d'=' -f2-)
          DB_PATH=${DB_PATH:-$APP_DIR/data.sqlite}
          case "$DB_PATH" in
            /*) ;;
            *) DB_PATH="$APP_DIR/$DB_PATH" ;;
          esac
          DB_PATH=$(readlink -m "$DB_PATH")
          case "$DB_PATH" in
            "$APP_DIR"/*) ;;
            *) echo "DB_PATH is outside APP_DIR; refusing unsafe backup"; exit 1 ;;
          esac
          # 数据库不存在时不阻断部署（新机器首次部署属于正常），但一定要在日志里喊出来，
          # 否则服务会静默地在一个空库上起来
          if [ -f "$DB_PATH" ]; then
            cp "$DB_PATH" "$BACKUP_DIR/data-$TIMESTAMP.sqlite"
            cp "$DB_PATH-shm" "$BACKUP_DIR/data-$TIMESTAMP.sqlite-shm" || true
            cp "$DB_PATH-wal" "$BACKUP_DIR/data-$TIMESTAMP.sqlite-wal" || true
            echo "已备份数据库 $DB_PATH -> data-$TIMESTAMP.sqlite"
          else
            echo "警告：$DB_PATH 不存在，本次没有备份；新进程将在空库上启动，请确认这是预期的"
          fi
          # 保留最近 7 天备份
          find $BACKUP_DIR -name 'data-*.sqlite*' -mtime +7 -delete || true

          # 确保新增环境变量存在（默认值）
          if ! grep -q "^HF_MIRROR=" .env; then
            echo "HF_MIRROR=https://hf-mirror.com/" >> .env
          fi
          if ! grep -q "^TRANSFORMERS_CACHE=" .env; then
            echo "TRANSFORMERS_CACHE=/home/ubuntu/kaoyan-xiaochengxu/.cache" >> .env
          fi

          # 确保模型缓存目录存在
          TRANSFORMERS_CACHE=$(grep "^TRANSFORMERS_CACHE=" .env | cut -d'=' -f2-)
          if [ -n "$TRANSFORMERS_CACHE" ]; then
            mkdir -p "$TRANSFORMERS_CACHE"
          fi

          # 安装依赖
          npm ci --omit=dev

          # 重启前真实获取一次微信 access_token。配置缺失、Secret 错误或 IP 未加白名单时
          # 直接失败，保持当前线上进程继续运行，不上传无法审核 UGC 的小程序版本。
          node <<'NODE'
          const config = require('./src/config');
          if (
            !config.wxAppId ||
            config.wxAppId !== config.expectedWxAppId ||
            !config.wxAppSecret ||
            !config.contentSecurityPublicBaseUrlValid
          ) {
            console.error('Content security credentials are missing');
            process.exit(1);
          }
          fetch('https://api.weixin.qq.com/cgi-bin/stable_token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: AbortSignal.timeout(15000),
            body: JSON.stringify({
              grant_type: 'client_credential',
              appid: config.wxAppId,
              secret: config.wxAppSecret,
              force_refresh: false
            })
          })
            .then((response) => response.json())
            .then((data) => {
              if (!data.access_token) {
                console.error(`Content security credential check failed (errcode=${data.errcode ?? 'unknown'})`);
                process.exit(1);
              }
            })
            .catch(() => {
              console.error('Content security credential check failed (network error)');
              process.exit(1);
            });
          NODE
          printf '%s\n' "$DEPLOY_SHA" > .content-security-verified

          # 清理并重新启动应用（避免旧配置残留导致 reload 异常）
          pm2 delete study-planner || true
          pm2 start ecosystem.config.cjs --env production

          # 健康检查：等待应用启动
          echo "Waiting for application to start..."
          for i in {1..12}; do
            if curl -fsS http://localhost:3000/healthz > /dev/null 2>&1; then
              echo "Health check passed"
              break
            fi
            if [ $i -eq 12 ]; then
              echo "Health check failed after 60 seconds"
              pm2 status
              pm2 logs study-planner --lines 100 --nostream
              exit 1
            fi
            sleep 5
          done

          CONTENT_SECURITY_HEALTH=$(curl -fsS http://localhost:3000/api/content-security/health)
          CONTENT_SECURITY_HEALTH="$CONTENT_SECURITY_HEALTH" DEPLOY_SHA="$DEPLOY_SHA" node -e '
            const health = JSON.parse(process.env.CONTENT_SECURITY_HEALTH);
            const required = ["msgSecCheck", "imgSecCheck", "mediaCheckAsync"];
            if (
              !health.configured ||
              !health.credentialsVerified ||
              health.deploymentSha !== process.env.DEPLOY_SHA ||
              !required.every((name) => health.apis.includes(name))
            ) {
              console.error("Content security backend is not verified for this deployment");
              process.exit(1);
            }
          '

          pm2 save
          echo "Deploy completed at $(date)"
          REMOTESCRIPT
