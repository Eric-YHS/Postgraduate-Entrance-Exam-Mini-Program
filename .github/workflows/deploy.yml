name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: SHA256:iLvZqf2B9Vxrw6vFqpVFKTTND8svG+4K/xTCIGjfEkE
          debug: true
          script: |
            set -e
            APP_DIR=/home/ubuntu/kaoyan-xiaochengxu
            BACKUP_DIR=$APP_DIR/backups
            cd $APP_DIR

            # 备份环境变量
            cp .env .env.backup

            # 部署前备份 SQLite 数据库
            mkdir -p $BACKUP_DIR
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            cp data/data.sqlite $BACKUP_DIR/data-$TIMESTAMP.sqlite || true
            cp data/data.sqlite-shm $BACKUP_DIR/data-$TIMESTAMP.sqlite-shm || true
            cp data/data.sqlite-wal $BACKUP_DIR/data-$TIMESTAMP.sqlite-wal || true
            # 保留最近 7 天备份
            find $BACKUP_DIR -name 'data-*.sqlite*' -mtime +7 -delete || true

            # 拉取最新代码
            git fetch origin main
            git checkout -f origin/main

            # 恢复环境变量
            cp .env.backup .env

            # 确保新增环境变量存在（默认值）
            if ! grep -q "^HF_MIRROR=" .env; then
              echo "HF_MIRROR=https://hf-mirror.com/" >> .env
            fi
            if ! grep -q "^TRANSFORMERS_CACHE=" .env; then
              echo "TRANSFORMERS_CACHE=/home/ubuntu/kaoyan-xiaochengxu/.cache" >> .env
            fi

            # 确保模型缓存目录存在
            TRANSFORMERS_CACHE=$(grep "^TRANSFORMERS_CACHE=" .env | cut -d'=' -f2-)
            if [ -n "$TRANSFORMERS_CACHE" ]; then
              mkdir -p "$TRANSFORMERS_CACHE"
            fi

            # 安装依赖
            npm ci --omit=dev

            # 清理并重新启动应用（避免旧配置残留导致 reload 异常）
            pm2 delete study-planner || true
            pm2 start ecosystem.config.cjs --env production

            # 健康检查：等待应用启动
            echo "Waiting for application to start..."
            for i in {1..12}; do
              if curl -fsS http://localhost:3000/healthz > /dev/null 2>&1; then
                echo "Health check passed"
                break
              fi
              if [ $i -eq 12 ]; then
                echo "Health check failed after 60 seconds"
                pm2 status
                pm2 logs study-planner --lines 100 --nostream
                exit 1
              fi
              sleep 5
            done

            pm2 save
            echo "Deploy completed at $(date)"
