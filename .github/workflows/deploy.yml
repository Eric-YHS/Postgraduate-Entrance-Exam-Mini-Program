name: Deploy to Server

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # 生产容器固定 TZ=Asia/Shanghai，测试里的 cron 匹配与推送静默时段（8-22 点）都按北京时间书写，
    # 因此 Runner 也必须固定时区，否则会出现「手动推送被判为 quiet_hours」这类偶发失败。
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # 服务器上部署时靠一份手工维护的 .env，新增变量如果没进 .env.example，
      # 下次重建环境就会静默地少了配置（例如订阅消息模板没配 → 推送静默失效）。
      - name: .env.example must cover every env var the code reads
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          used = set()
          for path in sorted(Path('src').rglob('*.js')):
              used |= set(re.findall(r'process\.env\.([A-Z_][A-Z0-9_]*)',
                                     path.read_text(encoding='utf-8', errors='replace')))
          documented = set(re.findall(
              r'^#?\s*([A-Z_][A-Z0-9_]*)=',
              Path('.env.example').read_text(encoding='utf-8'), re.M))
          missing = sorted(used - documented)
          if missing:
              print('read via process.env but absent from .env.example:')
              print('\n'.join(f'  {name}' for name in missing))
              sys.exit(1)
          print(f'ok  {len(used)} env vars documented in .env.example')
          PY

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # 小程序端是 TypeScript 写的（strict: true），但微信开发者工具只在上传那个时点才反它。
  # 以前只有后端的 npm test 会跑，页面里一个类型错误能安静地存在到下一次手工上传。
  miniprogram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: miniprogram/package-lock.json

      - name: Install dependencies
        working-directory: miniprogram
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: miniprogram
        run: npm run typecheck

      - name: Lint (eslint + prettier)
        working-directory: miniprogram
        run: npm run lint

      # 上传前会跑的发布模式校验，现在提前在 CI 里做，免得上图时才发现 app.json / 配置不一致
      - name: Verify release mode
        working-directory: miniprogram
        run: npm run verify:release

  deploy:
    needs: [test, miniprogram, secret-scan]
    runs-on: ubuntu-latest
    # 部署曾经会在 rsync 这一步挂住几个小时：链路半死时 TCP 连接不会自己报错，
    # 而一个卡住的 deploy 又会让后面所有提交排队，所以同时设置任务超时、
    # rsync 空闲超时与 ssh 保活探测，并让部署串行执行（不在传输中途被取消）
    timeout-minutes: 20
    concurrency:
      group: kaoyan-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          echo "SERVER_HOST length: ${#SERVER_HOST}"
          echo "SERVER_USER length: ${#SERVER_USER}"
          echo "SERVER_SSH_KEY length: ${#SERVER_SSH_KEY}"
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

      - name: Setup SSH config
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host deploy-server
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF
          printf '159.75.67.99 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM35P0tSfcOjdr9wvXq9C7IkGjwrKs1gxI3RTvUkYQTJ\n' > ~/.ssh/known_hosts
          ls -la ~/.ssh/
          echo '--- config ---'
          cat ~/.ssh/config
          echo '--- key head ---'
          head -n 1 ~/.ssh/deploy_key
          echo '--- known_hosts ---'
          cat ~/.ssh/known_hosts
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

      - name: Test SSH connection
        run: ssh deploy-server "echo 'SSH connection OK'"

      - name: Sync checked-out revision to server
        run: |
          APP_DIR=/home/ubuntu/kaoyan-xiaochengxu
          ssh deploy-server "test \"\$(readlink -f '$APP_DIR')\" = '$APP_DIR'"
          # related-projects/ 仅用于归档参考（其中 wechat-ai-assistant 就占 298MB），
          # 服务端运行与测试都不读取它；以前每次部署都要把它重传一遍，
          # 一个几秒钟的同步能跑上特别久，所以这里直接排除。
          # --timeout=300：传输 5 分钟没有进展就失败退出，避免永久挂起
          # 注意这里没有用 --delete：服务端的数据文件、上传目录等要保留，
          # 代价是仓库里删掉的文件不会自动从服务器上消失
          rsync -az --stats --timeout=300 \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.backup' \
            --exclude='.cache/' \
            --exclude='.playwright-mcp/' \
            --exclude='backups/' \
            --exclude='data/' \
            --exclude='data.sqlite' \
            --exclude='data.sqlite-shm' \
            --exclude='data.sqlite-wal' \
            --exclude='node_modules/' \
            --exclude='miniprogram/node_modules/' \
            --exclude='public/uploads/' \
            --exclude='private.*.key' \
            --exclude='wechat-platform-login*.png' \
            --exclude='related-projects/' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite-shm' \
            --exclude='*.sqlite-wal' \
            -e ssh ./ "deploy-server:$APP_DIR/"

      - name: Deploy via SSH
        run: |
          ssh deploy-server "DEPLOY_SHA='${{ github.sha }}' bash -s" <<'REMOTESCRIPT'
          set -e

          # 加载 nvm 环境（服务器使用 nvm 管理 Node）
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          command -v node && command -v npm && command -v pm2

          APP_DIR=/home/ubuntu/kaoyan-xiaochengxu
          BACKUP_DIR=$APP_DIR/backups
          test "$(readlink -f "$APP_DIR")" = "$APP_DIR"
          cd $APP_DIR

          # 备份环境变量
          # .env 是 rsync 显式排除的，只存在于服务器上；丢了就直接退，
          # 不要带着一堆 undefined 配置重启线上进程（上一次部署只留了一句
          # "cp: cannot stat '.env'"，看不出是于没文件还是目录不对）
          if [ ! -f .env ]; then
            echo "缺少 $APP_DIR/.env，终止部署（该文件不由 rsync 同步，只在服务器上）"
            ls -la "$APP_DIR" | head -30
            [ -f .env.backup ] && echo "检测到 .env.backup，可用它人工恢复"
            exit 1
          fi
          cp .env .env.backup
          chmod 600 .env .env.backup

          # 标记本次由 Runner 同步的精确提交；服务健康接口会回传该值。
          printf '%s\n' "$DEPLOY_SHA" > .deploy-sha
          rm -f .content-security-verified

          # 部署前备份 SQLite 数据库
          mkdir -p $BACKUP_DIR
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          DB_PATH=$(grep '^DB_PATH=' .env | tail -n 1 | cut -d'=' -f2-)
          DB_PATH=${DB_PATH:-$APP_DIR/data.sqlite}
          case "$DB_PATH" in
            /*) ;;
            *) DB_PATH="$APP_DIR/$DB_PATH" ;;
          esac
          DB_PATH=$(readlink -m "$DB_PATH")
          case "$DB_PATH" in
            "$APP_DIR"/*) ;;
            *) echo "DB_PATH is outside APP_DIR; refusing unsafe backup"; exit 1 ;;
          esac
          # 数据库不存在时不阻断部署（新机器首次部署属于正常），但一定要在日志里喊出来，
          # 否则服务会静默地在一个空库上起来
          if [ -f "$DB_PATH" ]; then
            cp "$DB_PATH" "$BACKUP_DIR/data-$TIMESTAMP.sqlite"
            cp "$DB_PATH-shm" "$BACKUP_DIR/data-$TIMESTAMP.sqlite-shm" || true
            cp "$DB_PATH-wal" "$BACKUP_DIR/data-$TIMESTAMP.sqlite-wal" || true
            echo "已备份数据库 $DB_PATH -> data-$TIMESTAMP.sqlite"
          else
            echo "警告：$DB_PATH 不存在，本次没有备份；新进程将在空库上启动，请确认这是预期的"
          fi
          # 保留最近 7 天备份
          find $BACKUP_DIR -name 'data-*.sqlite*' -mtime +7 -delete || true

          # 确保新增环境变量存在（默认值）
          if ! grep -q "^HF_MIRROR=" .env; then
            echo "HF_MIRROR=https://hf-mirror.com/" >> .env
          fi
          if ! grep -q "^TRANSFORMERS_CACHE=" .env; then
            echo "TRANSFORMERS_CACHE=/home/ubuntu/kaoyan-xiaochengxu/.cache" >> .env
          fi

          # 确保模型缓存目录存在
          TRANSFORMERS_CACHE=$(grep "^TRANSFORMERS_CACHE=" .env | cut -d'=' -f2-)
          if [ -n "$TRANSFORMERS_CACHE" ]; then
            mkdir -p "$TRANSFORMERS_CACHE"
          fi

          # 安装依赖
          npm ci --omit=dev

          # 重启前真实获取一次微信 access_token。配置缺失、Secret 错误或 IP 未加白名单时
          # 直接失败，保持当前线上进程继续运行，不上传无法审核 UGC 的小程序版本。
          node <<'NODE'
          const config = require('./src/config');
          if (
            !config.wxAppId ||
            config.wxAppId !== config.expectedWxAppId ||
            !config.wxAppSecret ||
            !config.contentSecurityPublicBaseUrlValid
          ) {
            console.error('Content security credentials are missing');
            process.exit(1);
          }
          fetch('https://api.weixin.qq.com/cgi-bin/stable_token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: AbortSignal.timeout(15000),
            body: JSON.stringify({
              grant_type: 'client_credential',
              appid: config.wxAppId,
              secret: config.wxAppSecret,
              force_refresh: false
            })
          })
            .then((response) => response.json())
            .then((data) => {
              if (!data.access_token) {
                console.error(`Content security credential check failed (errcode=${data.errcode ?? 'unknown'})`);
                process.exit(1);
              }
            })
            .catch(() => {
              console.error('Content security credential check failed (network error)');
              process.exit(1);
            });
          NODE
          printf '%s\n' "$DEPLOY_SHA" > .content-security-verified

          # 清理并重新启动应用（避免旧配置残留导致 reload 异常）
          pm2 delete study-planner || true
          pm2 start ecosystem.config.cjs --env production

          # 健康检查：等待应用启动
          echo "Waiting for application to start..."
          for i in {1..12}; do
            if curl -fsS http://localhost:3000/healthz > /dev/null 2>&1; then
              echo "Health check passed"
              break
            fi
            if [ $i -eq 12 ]; then
              echo "Health check failed after 60 seconds"
              pm2 status
              pm2 logs study-planner --lines 100 --nostream
              exit 1
            fi
            sleep 5
          done

          CONTENT_SECURITY_HEALTH=$(curl -fsS http://localhost:3000/api/content-security/health)
          CONTENT_SECURITY_HEALTH="$CONTENT_SECURITY_HEALTH" DEPLOY_SHA="$DEPLOY_SHA" node -e '
            const health = JSON.parse(process.env.CONTENT_SECURITY_HEALTH);
            const required = ["msgSecCheck", "imgSecCheck", "mediaCheckAsync"];
            if (
              !health.configured ||
              !health.credentialsVerified ||
              health.deploymentSha !== process.env.DEPLOY_SHA ||
              !required.every((name) => health.apis.includes(name))
            ) {
              console.error("Content security backend is not verified for this deployment");
              process.exit(1);
            }
          '

          pm2 save
          echo "Deploy completed at $(date)"
          REMOTESCRIPT

  # 密钥一旦 commit 进历史就很难清干净（science-pop 就漏过一个 Coze PAT）。
  # 这里只匹配高置信度的前缀，不做熵分析，避免把 CI 变成误报噪音。
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for committed credentials
        run: |
          python3 - <<'PY'
          import re, subprocess, sys

          PATTERNS = [
              ("GitHub token", re.compile(r"\b(ghp|gho|ghu|ghs|ghr)_[0-9A-Za-z]{20,}\b")),
              ("GitHub fine-grained PAT", re.compile(r"\bgithub_pat_[0-9A-Za-z_]{30,}\b")),
              ("OpenAI-style key", re.compile(r"\bsk-[0-9A-Za-z_-]{20,}\b")),
              ("AWS access key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("Slack token", re.compile(r"\bxox[baprs]-[0-9A-Za-z-]{10,}\b")),
              ("Google API key", re.compile(r"\bAIza[0-9A-Za-z_-]{30,}\b")),
              ("WeChat app secret", re.compile(
                  r"(?i)\b(wxappsecret|wx_app_secret|app_secret)\b\s*[:=]\s*['\"]?([0-9a-f]{32})['\"]?")),
              ("Coze PAT", re.compile(r"\bpat_[0-9A-Za-z]{20,}\b")),
          ]
          SKIP = {".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".pdf", ".zip", ".gz",
                  ".pkl", ".pt", ".pth", ".ckpt", ".onnx", ".bin", ".dll", ".so", ".pdb",
                  ".docx", ".hdr", ".ttf", ".woff", ".woff2", ".mp3", ".mp4", ".wav", ".h5",
                  ".safetensors", ".lock", ".whl", ".jar", ".class"}

          files = subprocess.run(["git", "ls-files", "-z"], capture_output=True,
                                 text=True).stdout.split("\0")
          hits = []
          for name in filter(None, files):
              if name.endswith(tuple(SKIP)):
                  continue
              try:
                  blob = open(name, "rb").read(2 * 1024 * 1024)
              except OSError:
                  continue
              if b"\0" in blob:
                  continue
              text = blob.decode("utf-8", "replace")
              for label, pat in PATTERNS:
                  for m in pat.finditer(text):
                      hits.append(f"{label}: {name}: {m.group(0)[:24]}")
          if hits:
              print("\n".join(hits))
              sys.exit("发现疑似明文密钥（见上）；确认是误报就把该文件加进 SKIP 或换成占位符")
          print(f"ok  已扫描 {len([f for f in files if f])} 个文件，未发现明文密钥")
          PY
