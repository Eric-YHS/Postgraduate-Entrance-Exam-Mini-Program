name: Deploy to Server

# 代码质量检查在 ci.yml 里；这条工作流只负责「把已经绿过的提交推到服务器」。
# 之前测试和部署挤在同一条 push 触发的工作流里：服务器缺 .env、SSH 抖动这类
# 纯运维问题会把 npm test 也标成红叉，PR 上看不出到底是哪里坏了。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # 服务器上手工改过配置、或者需要把已经部署过的提交再重启一次时用这个
  workflow_dispatch:
    inputs:
      allow_empty_db:
        description: '允许数据库为空（刚重置过库时勾选，跳过空库守卫）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    # 手工触发时 github.event.workflow_run 是空的，所以两种触发方式分开判断。
    # workflow_run 只会看 CI 的结论，不会重复跑测试；event/branch 判断是为了排除
    # 由 PR 触发的那次 CI 运行（PR 还没合就部署会把 main 之外的代码推上线）。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # 部署曾经会在 rsync 这一步挂住几个小时：链路半死时 TCP 连接不会自己报错，
    # 而一个卡住的 deploy 又会让后面所有提交排队，所以同时设置任务超时、
    # rsync 空闲超时与 ssh 保活探测，并让部署串行执行（不在传输中途被取消）
    timeout-minutes: 20
    concurrency:
      group: kaoyan-deploy
      cancel-in-progress: false
    steps:
      - name: Resolve target commit
        id: target
        # workflow_run 触发时 Runner 默认检出的是「触发它的那次运行」的仓库快照，
        # 而不是 main；不显式锁 SHA 就可能部署到比被测提交更新的 HEAD，
        # 那部分代码是没跑过测试的。
        env:
          run_sha: ${{ github.event.workflow_run.head_sha }}
          dispatch_sha: ${{ github.sha }}
        run: |
          sha="${run_sha:-$dispatch_sha}"
          test -n "$sha" || { echo "无法确定要部署的提交"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "将部署提交 $sha（触发方式 ${{ github.event_name }}）"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Check secrets are set
        run: |
          echo "SERVER_HOST length: ${#SERVER_HOST}"
          echo "SERVER_USER length: ${#SERVER_USER}"
          echo "SERVER_SSH_KEY length: ${#SERVER_SSH_KEY}"
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

      - name: Setup SSH config
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host deploy-server
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF
          printf '159.75.67.99 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM35P0tSfcOjdr9wvXq9C7IkGjwrKs1gxI3RTvUkYQTJ\n' > ~/.ssh/known_hosts
          ls -la ~/.ssh/
          echo '--- config ---'
          cat ~/.ssh/config
          echo '--- key head ---'
          head -n 1 ~/.ssh/deploy_key
          echo '--- known_hosts ---'
          cat ~/.ssh/known_hosts
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

      - name: Test SSH connection
        run: ssh deploy-server "echo 'SSH connection OK'"

      # 服务器上的 .env 一旦被误删，部署会永远卡在那道 .env 检查上，而没有 SSH
      # 权限的人完全无法推进（实际就碰上过：仓库侧什么都错了，但只有服务器少了一个文件）。
      # 配了可选的 SERVER_DOTENV secret 时，这里做一次「只在文件缺失时」的兜底重建；
      # 没配就什么都不做，行为跟以前完全一致。后面的 SESSION_SECRET 长度校验会接着把关，
      # 重建内容不对也不会带病重启。
      - name: Rebuild server .env from secret when missing
        env:
          SERVER_DOTENV: ${{ secrets.SERVER_DOTENV }}
        run: |
          APP_DIR=/home/ubuntu/kaoyan-xiaochengxu
          if ssh deploy-server "test -f $APP_DIR/.env"; then
            echo "服务器已有 .env，跳过重建（这一步只在文件缺失时兜底）"
            exit 0
          fi
          if [ -z "$SERVER_DOTENV" ]; then
            echo "服务器缺 $APP_DIR/.env，且未配置 SERVER_DOTENV secret，继续让部署脚本按原逻辑报错"
            exit 0
          fi
          printf '%s\n' "$SERVER_DOTENV" | ssh deploy-server "umask 077 && cat > $APP_DIR/.env && wc -l < $APP_DIR/.env"
          echo "已从 SERVER_DOTENV 重建 .env（只写了变量名对应的行，未回显任何值）"

      # 回滚快照：rsync 是直接覆盖工作目录的，新代码一旦起不来，服务器上连旧代码都不剩，
      # 站点会一直挂着等人。同步之前先把当前代码打包到 backups/，健康检查失败时原地还原。
      # 排除掉的都是运行期数据（数据库、上传、模型缓存、备份目录本身），不是代码。
      - name: Snapshot current server code (rollback point)
        run: |
          APP_DIR=/home/ubuntu/kaoyan-xiaochengxu
          ssh deploy-server "
            set -e
            mkdir -p $APP_DIR/backups
            if [ -d $APP_DIR/src ]; then
              tar czf $APP_DIR/backups/app-before-deploy.tar.gz -C $APP_DIR \
                --exclude=./node_modules --exclude=./miniprogram/node_modules \
                --exclude=./.git --exclude=./backups --exclude=./data --exclude=./.cache \
                --exclude=./public/uploads --exclude=./related-projects \
                --exclude=./.env --exclude='./.env.*' --exclude='./*.sqlite' --exclude='./*.sqlite-*' \
                --exclude='./private.*.key' --exclude='./*.log' .
              ls -lh $APP_DIR/backups/app-before-deploy.tar.gz
            else
              echo '服务器上还没有代码（首次部署），跳过回滚快照'
            fi
          "

      - name: Sync checked-out revision to server
        run: |
          APP_DIR=/home/ubuntu/kaoyan-xiaochengxu
          ssh deploy-server "test \"\$(readlink -f '$APP_DIR')\" = '$APP_DIR'"
          # related-projects/ 仅用于归档参考（其中 wechat-ai-assistant 就占 298MB），
          # 服务端运行与测试都不读取它；以前每次部署都要把它重传一遍，
          # 一个几秒钟的同步能跑上特别久，所以这里直接排除。
          # --timeout=300：传输 5 分钟没有进展就失败退出，避免永久挂起
          # 注意这里没有用 --delete：服务端的数据文件、上传目录等要保留，
          # 代价是仓库里删掉的文件不会自动从服务器上消失
          rsync -az --stats --timeout=300 \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.backup' \
            --exclude='.cache/' \
            --exclude='.playwright-mcp/' \
            --exclude='backups/' \
            --exclude='data/' \
            --exclude='data.sqlite' \
            --exclude='data.sqlite-shm' \
            --exclude='data.sqlite-wal' \
            --exclude='node_modules/' \
            --exclude='miniprogram/node_modules/' \
            --exclude='public/uploads/' \
            --exclude='private.*.key' \
            --exclude='wechat-platform-login*.png' \
            --exclude='related-projects/' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite-shm' \
            --exclude='*.sqlite-wal' \
            -e ssh ./ "deploy-server:$APP_DIR/"

      - name: Deploy via SSH
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          # 手工触发时可以勾选跳过空库守卫；workflow_run 触发时这里永远是 false
          ALLOW_EMPTY_DB: ${{ github.event.inputs.allow_empty_db || 'false' }}
        run: |
          # ssh 不会把 Runner 的环境变量带过去（sshd 默认不收 AcceptEnv），
          # 要用的变量只能在这里逐个显式传，不传远端读到的是空字符串
          ssh deploy-server "DEPLOY_SHA='$DEPLOY_SHA' ALLOW_EMPTY_DB='$ALLOW_EMPTY_DB' SERVER_HOST='$SERVER_HOST' bash -s" <<'REMOTESCRIPT'
          set -e

          # 加载 nvm 环境（服务器使用 nvm 管理 Node）
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          command -v node && command -v npm && command -v pm2

          APP_DIR=/home/ubuntu/kaoyan-xiaochengxu
          BACKUP_DIR=$APP_DIR/backups
          test "$(readlink -f "$APP_DIR")" = "$APP_DIR"
          cd $APP_DIR

          # 备份环境变量
          # .env 是 rsync 显式排除的，只存在于服务器上；丢了就直接退，
          # 不要带着一堆 undefined 配置重启线上进程（上一次部署只留了一句
          # "cp: cannot stat '.env'"，看不出是于没文件还是目录不对）
          if [ ! -f .env ]; then
            echo "缺少 $APP_DIR/.env，终止部署（该文件不由 rsync 同步，只在服务器上）"
            ls -la "$APP_DIR" | head -30
            [ -f .env.backup ] && echo "检测到 .env.backup，可用它人工恢复"
            echo "也可以配置仓库 secret SERVER_DOTENV，下次部署会自动重建（见 docs/GitHub自动部署配置指南.md）"
            exit 1
          fi
          cp .env .env.backup
          chmod 600 .env .env.backup

          # ecosystem.config.cjs 默认使 env（NODE_ENV=development），而 config.js 只在
          # NODE_ENV=production 时才强校验 SESSION_SECRET：密钥缺失时进程会用一个随机
          # 密钥启起来，重启就全体掉线而且现场没有任何提示。这里在动线上进程之前先把
          # 这道关卡补上（npm start 的 --env-file-if-exists 同理，文件不在也不会报错）
          node -e '
            const fs = require("fs");
            const lines = fs.readFileSync(".env", "utf8").split("\n");
            let value = "";
            for (const raw of lines) {
              const line = raw.trim();
              if (line.startsWith("SESSION_SECRET=")) {
                // \x27 是单引号：这段整体写在 shell 的单引号里，不能出现字面单引号
                value = line.slice("SESSION_SECRET=".length).trim().replace(/^[\x27"]|[\x27"]$/g, "");
              }
            }
            if (value.length < 32) {
              console.error("FATAL: .env 里的 SESSION_SECRET 缺失或短于 32 字符（当前 " + value.length + "），终止部署");
              console.error("用 npm run generate-secret 生成后写到服务器上的 .env 里");
              process.exit(1);
            }
            console.log("SESSION_SECRET 长度校验通过");
          '

          # 上一个版本的 commit（万一健康检查失败，回滚后靠它把标记文件写回旧版本）
          PREV_DEPLOY_SHA=$(cat .deploy-sha 2>/dev/null || echo unknown)

          # 标记本次由 Runner 同步的精确提交；服务健康接口会回传该值。
          printf '%s\n' "$DEPLOY_SHA" > .deploy-sha
          rm -f .content-security-verified

          # 部署前备份 SQLite 数据库
          mkdir -p $BACKUP_DIR
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          DB_PATH=$(grep '^DB_PATH=' .env | tail -n 1 | cut -d'=' -f2-)
          DB_PATH=${DB_PATH:-$APP_DIR/data.sqlite}
          case "$DB_PATH" in
            /*) ;;
            *) DB_PATH="$APP_DIR/$DB_PATH" ;;
          esac
          DB_PATH=$(readlink -m "$DB_PATH")
          case "$DB_PATH" in
            "$APP_DIR"/*) ;;
            *) echo "DB_PATH is outside APP_DIR; refusing unsafe backup"; exit 1 ;;
          esac
          # 数据库不存在时不阻断部署（新机器首次部署属于正常），但一定要在日志里喊出来，
          # 否则服务会静默地在一个空库上起来
          if [ -f "$DB_PATH" ]; then
            cp "$DB_PATH" "$BACKUP_DIR/data-$TIMESTAMP.sqlite"
            cp "$DB_PATH-shm" "$BACKUP_DIR/data-$TIMESTAMP.sqlite-shm" || true
            cp "$DB_PATH-wal" "$BACKUP_DIR/data-$TIMESTAMP.sqlite-wal" || true
            echo "已备份数据库 $DB_PATH -> data-$TIMESTAMP.sqlite"
          else
            echo "警告：$DB_PATH 不存在，本次没有备份；新进程将在空库上启动，请确认这是预期的"
          fi
          # 保留最近 7 天备份
          find $BACKUP_DIR -name 'data-*.sqlite*' -mtime +7 -delete || true

          # 确保新增环境变量存在（默认值）
          if ! grep -q "^HF_MIRROR=" .env; then
            echo "HF_MIRROR=https://hf-mirror.com/" >> .env
          fi
          if ! grep -q "^TRANSFORMERS_CACHE=" .env; then
            echo "TRANSFORMERS_CACHE=/home/ubuntu/kaoyan-xiaochengxu/.cache" >> .env
          fi

          # 确保模型缓存目录存在
          TRANSFORMERS_CACHE=$(grep "^TRANSFORMERS_CACHE=" .env | cut -d'=' -f2-)
          if [ -n "$TRANSFORMERS_CACHE" ]; then
            mkdir -p "$TRANSFORMERS_CACHE"
          fi

          # 安装依赖
          npm ci --omit=dev

          # 空库守卫：上一次成功部署时库里多少人多少题，记在 .deploy-db-stats.json；
          # 这次读到的库却不见了或空了，说明 .env 里的 DB_PATH 指到了别处（.env 丢了，
          # DB_PATH 就退回默认值）。以前这种情况只在备份那一步打一行警告，然后新进程
          # 在空库上启动、/healthz 照样返回 ok，线上安静地变成「所有用户都不存在」。
          # 现在放在删旧进程之前失败，旧进程继续服务；统计本身出错只会警告，不卡部署。
          STATS_FILE=$APP_DIR/.deploy-db-stats.json
          DB_STATS=$(node -e '
            const fs = require("fs");
            const p = process.argv[1];
            if (!fs.existsSync(p)) { console.log("missing"); process.exit(0); }
            try {
              const Database = require("better-sqlite3");
              const db = new Database(p, { readonly: true, fileMustExist: true });
              const count = (t) => { try { return db.prepare("select count(*) as n from " + t).get().n; } catch { return -1; } };
              console.log(JSON.stringify({ users: count("users"), questions: count("questions") }));
            } catch (err) {
              console.log("unknown");
            }
          ' "$DB_PATH")
          PREV_USERS=$(node -e '
            try { const v = Number(require(process.argv[1]).users); console.log(Number.isFinite(v) ? v : -1); } catch { console.log(-1); }
          ' "$STATS_FILE" 2>/dev/null || echo -1)
          CUR_USERS=$(node -e '
            try { console.log(JSON.parse(process.argv[1]).users); } catch { console.log(-1); }
          ' "$DB_STATS")
          echo "数据库规模：$DB_PATH → $DB_STATS（上次成功部署 users=$PREV_USERS）"
          if [ "$ALLOW_EMPTY_DB" != "true" ] && [ "$PREV_USERS" -gt 0 ] 2>/dev/null && { [ "$DB_STATS" = "missing" ] || [ "$CUR_USERS" = "0" ]; }; then
            echo "FATAL: 上次成功部署时库里有 $PREV_USERS 个用户，这次读 $DB_PATH 却是空的/不存在，终止部署"
            echo "旧进程未被动过，线上照服。先查 .env 里的 DB_PATH 是否指向真正的库文件；"
            echo "确实刚重置过数据库，就用 Allow empty database 手工触发一次部署。"
            exit 1
          fi

          # 重启前真实获取一次微信 access_token。配置缺失、Secret 错误或 IP 未加白名单时
          # 直接失败，保持当前线上进程继续运行，不上传无法审核 UGC 的小程序版本。
          node <<'NODE'
          const config = require('./src/config');
          if (
            !config.wxAppId ||
            config.wxAppId !== config.expectedWxAppId ||
            !config.wxAppSecret ||
            !config.contentSecurityPublicBaseUrlValid
          ) {
            console.error('Content security credentials are missing');
            process.exit(1);
          }
          fetch('https://api.weixin.qq.com/cgi-bin/stable_token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: AbortSignal.timeout(15000),
            body: JSON.stringify({
              grant_type: 'client_credential',
              appid: config.wxAppId,
              secret: config.wxAppSecret,
              force_refresh: false
            })
          })
            .then((response) => response.json())
            .then((data) => {
              if (!data.access_token) {
                console.error(`Content security credential check failed (errcode=${data.errcode ?? 'unknown'})`);
                process.exit(1);
              }
            })
            .catch(() => {
              console.error('Content security credential check failed (network error)');
              process.exit(1);
            });
          NODE
          printf '%s\n' "$DEPLOY_SHA" > .content-security-verified

          # 清理并重新启动应用（避免旧配置残留导致 reload 异常）
          ROLLBACK_TARBALL=$BACKUP_DIR/app-before-deploy.tar.gz

          # 每 5 秒探一次 /healthz，最多 12 次（60 秒）
          wait_for_health() {
            for i in {1..12}; do
              if curl -fsS http://localhost:3000/healthz > /dev/null 2>&1; then return 0; fi
              sleep 5
            done
            return 1
          }

          pm2 delete study-planner || true
          pm2 start ecosystem.config.cjs --env production

          # 健康检查：等待应用启动
          echo "Waiting for application to start..."
          if ! wait_for_health; then
            echo "FATAL: 新进程 60 秒内没有通过 /healthz"
            pm2 status || true
            pm2 logs study-planner --lines 100 --nostream || true
            # 不回滚的话，代码已被 rsync 覆盖、旧进程已被删，站点会一直挂着等人上门。
            # 注：tar 只覆盖同名文件，新版本新增的文件（新路由等）会留在原地，但
            # package-lock 与下面两个标记文件都回到旧版本，跑的确实是旧代码。
            # 本次部署仍然算失败（最后 exit 1）。
            if [ -f "$ROLLBACK_TARBALL" ]; then
              echo "回滚到部署前的代码（commit $PREV_DEPLOY_SHA）"
              tar xzf "$ROLLBACK_TARBALL" -C "$APP_DIR"
              # 标记文件按回滚前的版本重写（tar 里可能根本没有），不让健康接口报一个
              # 根本没在跑的 commit：/api/content-security/health 只在两个标记相等时才算 verified
              printf '%s\n' "$PREV_DEPLOY_SHA" > .deploy-sha
              if [ "$PREV_DEPLOY_SHA" = "unknown" ]; then
                rm -f .content-security-verified
              else
                printf '%s\n' "$PREV_DEPLOY_SHA" > .content-security-verified
              fi
              # 依赖也回到旧 lock；装不动就先保留现有 node_modules，不要卡住重启
              npm ci --omit=dev || echo "回滚时 npm ci 失败，沿用了当前 node_modules"
              pm2 delete study-planner || true
              pm2 start ecosystem.config.cjs --env production
              if wait_for_health; then
                echo "回滚后应用已恢复，线上继续跑上一个版本，请把新代码修好再部署"
              else
                echo "回滚后应用仍未启动，需要人工登录服务器处理"
              fi
            else
              echo "没有 $ROLLBACK_TARBALL（首次部署或被清理），没有可回滚的代码"
            fi
            exit 1
          fi
          echo "Health check passed"

          CONTENT_SECURITY_HEALTH=$(curl -fsS http://localhost:3000/api/content-security/health)
          CONTENT_SECURITY_HEALTH="$CONTENT_SECURITY_HEALTH" DEPLOY_SHA="$DEPLOY_SHA" node -e '
            const health = JSON.parse(process.env.CONTENT_SECURITY_HEALTH);
            const required = ["msgSecCheck", "imgSecCheck", "mediaCheckAsync"];
            if (
              !health.configured ||
              !health.credentialsVerified ||
              health.deploymentSha !== process.env.DEPLOY_SHA ||
              !required.every((name) => health.apis.includes(name))
            ) {
              console.error("Content security backend is not verified for this deployment");
              process.exit(1);
            }
          '

          # 基线只在整条链路都成功之后才更新，失败的部署不会把上一次的数字冲掉；
          # 没读到真实数字（missing/unknown）时保留旧基线，不要把哨兵值当成基线写回去
          case "$DB_STATS" in
            '{'*) printf '%s\n' "$DB_STATS" > "$STATS_FILE" ;;
            *) echo "本次没读到数据库规模（$DB_STATS），保留 $STATS_FILE 里的旧基线" ;;
          esac

          pm2 save
          echo "访问地址：http://$SERVER_HOST"
          echo "Deploy completed at $(date)"
          REMOTESCRIPT

      # 只看红叉的人不必翻完几百行日志才知道这次是机器少了文件、不是代码坏了：
      # 失败时把目标、已排除的原因和两条恢复路径写进运行摘要。
      - name: Summarise failure
        if: failure()
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          APP_DIR=/home/ubuntu/kaoyan-xiaochengxu
          {
