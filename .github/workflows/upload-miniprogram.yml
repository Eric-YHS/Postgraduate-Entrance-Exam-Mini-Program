name: Upload MiniProgram

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "miniprogram/**"

jobs:
  upload:
    runs-on: ubuntu-latest
    # miniprogram-ci 不会替 tsc 把关，类型错误只会静默地进到线上体验版里，
    # 所以上传前面先过一遍 typecheck / lint；concurrency 串行避免两个相邻提交交叉上传。
    concurrency:
      group: upload-miniprogram
      cancel-in-progress: false
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./miniprogram
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./miniprogram/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (eslint + prettier)
        run: npm run lint

      - name: Write WeChat private key
        env:
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        run: |
          test -n "$WECHAT_PRIVATE_KEY"
          install -m 600 /dev/null private.wx27fca32a9ddfdc8e.key
          printf '%s\n' "$WECHAT_PRIVATE_KEY" > private.wx27fca32a9ddfdc8e.key

      - name: Upload MiniProgram
        run: |
          npm run upload ${{ github.run_number }} "CI 自动上传 ${{ github.sha }}"

      - name: Remove private key
        if: always()
        run: rm -f private.wx27fca32a9ddfdc8e.key
