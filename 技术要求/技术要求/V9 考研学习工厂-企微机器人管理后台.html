<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>考研学习工厂 · 企微机器人管理后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #f5f1ea;
    --bg-surface: #ffffff;
    --bg-sidebar: #1a2332;
    --bg-sidebar-hover: #243349;
    --bg-active: #2d3f5a;
    --bg-soft: #faf6ef;
    --bg-code: #f0ebe2;
    --text-primary: #1a2332;
    --text-secondary: #5a6478;
    --text-tertiary: #8b94a6;
    --text-inverse: #f5f1ea;
    --text-sidebar: #b8c2d4;
    --text-sidebar-active: #ffffff;
    --accent-cinnabar: #c8392f;
    --accent-ink: #2d3f5a;
    --accent-gold: #b8954a;
    --accent-jade: #5a8270;
    --accent-amber: #d4a04c;
    --accent-rust: #b85a3e;
    --accent-slate: #6b7a8f;
    --border-subtle: #e8e2d6;
    --border-default: #d6cfbf;
    --border-strong: #1a2332;
    --text-xs: 11px;
    --text-sm: 12px;
    --text-base: 13px;
    --text-md: 14px;
    --text-lg: 16px;
    --text-xl: 20px;
    --text-2xl: 26px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 10px;
    --font-display: 'Noto Serif SC', 'Songti SC', 'STSong', serif;
    --font-body: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg-page); color: var(--text-primary);
    font-family: var(--font-body); font-size: var(--text-base); line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; cursor: pointer; }

  .app {
    display: grid; grid-template-columns: 200px 1fr; grid-template-rows: 56px 1fr;
    grid-template-areas: "sidebar topbar" "sidebar main"; height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    grid-area: sidebar; background: var(--bg-sidebar); color: var(--text-sidebar);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .brand { padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--bg-active); flex-shrink: 0; }
  .brand-mark {
    font-family: var(--font-display); font-size: 17px; font-weight: 900;
    color: var(--text-inverse); letter-spacing: 0.04em;
  }
  .brand-mark::after { content: "·"; color: var(--accent-cinnabar); margin-left: 2px; }
  .brand-sub { font-size: 10px; color: var(--text-tertiary); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 4px; }
  .nav { flex: 1; padding: var(--space-3) 0; overflow-y: auto; }
  .nav-item {
    display: flex; align-items: center; gap: var(--space-3);
    padding: 6px var(--space-5); color: var(--text-sidebar); cursor: pointer; position: relative;
  }
  .nav-item:hover { background: var(--bg-sidebar-hover); }
  .nav-item.active { background: var(--bg-active); color: var(--text-sidebar-active); }
  .nav-item.active::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent-cinnabar);
  }
  .nav-icon { width: 14px; height: 14px; flex-shrink: 0; }
  .nav-label { flex: 1; font-size: 13px; }
  .nav-badge {
    background: var(--accent-cinnabar); color: var(--text-inverse);
    font-size: 10px; padding: 1px 6px; border-radius: 8px; font-weight: 600;
    min-width: 18px; text-align: center;
  }
  .nav-badge-soft { background: rgba(255,255,255,0.08); color: var(--text-sidebar); }

  /* Topbar */
  .topbar {
    grid-area: topbar; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle);
    display: flex; align-items: center; padding: 0 var(--space-6); gap: var(--space-4);
  }
  .breadcrumb { display: flex; align-items: center; gap: var(--space-2); color: var(--text-secondary); font-size: var(--text-md); }
  .breadcrumb-current { color: var(--text-primary); font-weight: 500; }
  .breadcrumb a { cursor: pointer; }
  .breadcrumb a:hover { color: var(--accent-ink); }
  .topbar-spacer { flex: 1; }
  .search { position: relative; width: 240px; }
  .search input {
    width: 100%; height: 30px; border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
    padding: 0 var(--space-3) 0 30px; background: var(--bg-soft); font-size: var(--text-base);
  }
  .search input:focus { outline: none; border-color: var(--accent-ink); background: var(--bg-surface); }
  .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); width: 13px; height: 13px; }
  .topbar-btn {
    width: 30px; height: 30px; border: none; background: transparent; border-radius: var(--radius-md);
    cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); position: relative;
  }
  .topbar-btn:hover { background: var(--bg-soft); }
  .topbar-btn-dot {
    position: absolute; top: 6px; right: 6px; width: 6px; height: 6px;
    background: var(--accent-cinnabar); border-radius: 50%; border: 1.5px solid var(--bg-surface);
  }
  .role-switch {
    display: flex; align-items: center; background: var(--bg-soft); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md); padding: 2px; height: 30px;
  }
  .role-tab {
    padding: 0 10px; height: 24px; border: none; background: transparent; border-radius: 3px;
    font-size: 12px; color: var(--text-secondary); cursor: pointer; font-weight: 500;
  }
  .role-tab.active { background: var(--bg-surface); color: var(--text-primary); box-shadow: 0 1px 2px rgba(26,35,50,0.06); }
  .user-chip { display: flex; align-items: center; gap: var(--space-2); padding: 4px 10px 4px 4px; border-radius: 20px; cursor: pointer; }
  .user-chip:hover { background: var(--bg-soft); }
  .avatar {
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, #c8392f, #b8954a);
    display: flex; align-items: center; justify-content: center; color: var(--text-inverse);
    font-family: var(--font-display); font-weight: 700; font-size: 12px;
  }
  .user-chip-name { font-size: var(--text-md); color: var(--text-primary); font-weight: 500; }
  .user-chip-role { font-size: var(--text-xs); color: var(--text-tertiary); }

  /* Main */
  .main { grid-area: main; overflow-y: auto; padding: var(--space-6) var(--space-8); }
  .page-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: var(--space-5); padding-bottom: var(--space-4); border-bottom: 1px solid var(--border-subtle);
  }
  .page-title { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 700; margin: 0; color: var(--text-primary); letter-spacing: 0.01em; }
  .page-subtitle { color: var(--text-secondary); font-size: var(--text-md); margin-top: 4px; }
  .page-actions { display: flex; gap: var(--space-2); }
  .btn {
    height: 30px; padding: 0 var(--space-4); border: 1px solid var(--border-default);
    background: var(--bg-surface); color: var(--text-primary); border-radius: var(--radius-md);
    font-size: var(--text-md); font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: var(--space-2);
    transition: all 0.12s;
  }
  .btn:hover { border-color: var(--text-primary); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent-ink); color: var(--text-inverse); border-color: var(--accent-ink); }
  .btn-primary:hover { background: var(--bg-sidebar); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
  .btn-ghost:hover { background: var(--bg-soft); border-color: transparent; }
  .btn-cinnabar { background: var(--accent-cinnabar); color: var(--text-inverse); border-color: var(--accent-cinnabar); }
  .btn-cinnabar:hover { background: #b0332a; }
  .btn-sm { height: 26px; padding: 0 10px; font-size: var(--text-sm); }
  .ico { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* KPI */
  .kpi-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-3); margin-bottom: var(--space-5); }
  .kpi-card {
    background: var(--bg-surface); border: 1px solid var(--border-subtle);
    padding: var(--space-4); border-radius: var(--radius-md); position: relative; cursor: pointer;
    transition: all 0.15s;
  }
  .kpi-card:hover { box-shadow: 0 2px 8px rgba(26,35,50,0.08); border-color: var(--border-default); }
  .kpi-card::before { content: ""; position: absolute; top: 0; left: 0; width: 2px; height: 20px; background: var(--accent-cinnabar); }
  .kpi-card.kpi-warn::before { background: var(--accent-amber); }
  .kpi-card.kpi-good::before { background: var(--accent-jade); }
  .kpi-card.kpi-info::before { background: var(--accent-ink); }
  .kpi-card.kpi-gold::before { background: var(--accent-gold); }
  .kpi-label { font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-2); display: flex; align-items: center; justify-content: space-between; }
  .kpi-value { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 700; color: var(--text-primary); line-height: 1; }
  .kpi-unit { font-size: var(--text-md); color: var(--text-secondary); margin-left: 2px; font-family: var(--font-body); font-weight: 400; }
  .kpi-delta { margin-top: var(--space-2); font-size: var(--text-xs); color: var(--text-tertiary); line-height: 1.5; }
  .kpi-delta strong { color: var(--text-primary); font-weight: 600; }
  .kpi-delta .warn { color: var(--accent-amber); font-weight: 600; }

  /* Section */
  .section { margin-bottom: var(--space-5); }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--space-3); }
  .section-title { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; margin: 0; }
  .section-meta { font-size: var(--text-sm); color: var(--text-secondary); }
  .section-actions { display: flex; gap: var(--space-2); }

  /* Filter */
  .filter-bar {
    background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
    padding: var(--space-2) var(--space-3); margin-bottom: var(--space-3);
    display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
  }
  .filter-label { font-size: var(--text-sm); color: var(--text-secondary); font-weight: 500; }
  .chip-group { display: flex; gap: 4px; }
  .chip {
    height: 26px; padding: 0 12px; border: 1px solid var(--border-subtle);
    background: var(--bg-surface); color: var(--text-secondary); border-radius: 13px;
    font-size: var(--text-sm); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: all 0.12s; user-select: none;
  }
  .chip:hover { border-color: var(--border-default); }
  .chip.active { background: var(--bg-sidebar); color: var(--text-inverse); border-color: var(--bg-sidebar); }
  .chip-count {
    background: rgba(255,255,255,0.2); padding: 0 6px; border-radius: 8px;
    font-size: 10px; font-family: var(--font-mono);
  }
  .chip:not(.active) .chip-count { background: var(--bg-soft); color: var(--text-tertiary); }
  .filter-spacer { flex: 1; }
  .filter-search { position: relative; width: 200px; }
  .filter-search input {
    width: 100%; height: 26px; border: 1px solid var(--border-subtle); border-radius: 13px;
    padding: 0 12px 0 28px; font-size: var(--text-sm); background: var(--bg-soft);
  }
  .filter-search input:focus { outline: none; border-color: var(--accent-ink); background: var(--bg-surface); }
  .filter-search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text-tertiary); width: 12px; height: 12px;
  }

  /* Table */
  .table { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); overflow: hidden; }
  .data-table { width: 100%; border-collapse: collapse; font-size: var(--text-base); }
  .data-table thead th {
    text-align: left; font-weight: 500; color: var(--text-tertiary); padding: 10px var(--space-4);
    border-bottom: 1px solid var(--border-subtle); background: var(--bg-soft);
    font-size: var(--text-xs); letter-spacing: 0.05em; text-transform: uppercase;
  }
  .data-table tbody td {
    padding: 10px var(--space-4); border-bottom: 1px solid var(--border-subtle); vertical-align: middle;
  }
  .data-table tbody tr:last-child td { border-bottom: none; }
  .data-table tbody tr { cursor: pointer; }
  .data-table tbody tr:hover td { background: var(--bg-soft); }
  .data-table tbody tr.selected td { background: rgba(45, 63, 90, 0.06); box-shadow: inset 2px 0 0 var(--accent-cinnabar); }
  .data-table tbody tr.row-draft td { background: rgba(212, 160, 76, 0.03); }
  .data-table tbody tr.row-draft:hover td { background: rgba(212, 160, 76, 0.08); }
  .col-name { width: 28%; }
  .col-status { width: 100px; }
  .col-num { width: 80px; text-align: right; font-family: var(--font-mono); color: var(--text-secondary); font-size: 12px; }
  .col-update { width: 80px; text-align: right; font-family: var(--font-mono); color: var(--text-tertiary); font-size: 11px; }
  .col-action { width: 60px; text-align: right; }

  .robot-cell { display: flex; align-items: center; gap: var(--space-3); }
  .robot-mark {
    width: 30px; height: 30px; border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 13px;
    color: var(--text-inverse); flex-shrink: 0;
    border: 1.5px solid var(--bg-surface); box-shadow: 0 0 0 1px var(--border-subtle);
  }
  .robot-mark-draft {
    background: transparent !important; color: var(--text-tertiary) !important;
    border: 1.5px dashed var(--border-default); box-shadow: none; font-weight: 400;
  }
  .robot-info { line-height: 1.3; min-width: 0; }
  .robot-info-name { font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
  .robot-info-id { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); letter-spacing: 0.05em; font-weight: 400; }
  .robot-info-role { font-size: var(--text-sm); color: var(--text-secondary); margin-top: 2px; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-xs);
    padding: 2px 8px; border-radius: 10px; font-weight: 500; white-space: nowrap;
    cursor: pointer; user-select: none;
  }
  .status-pill:hover { transform: scale(1.02); }
  .status-online { background: rgba(90, 130, 112, 0.1); color: var(--accent-jade); }
  .status-online::before { content: ""; width: 6px; height: 6px; background: var(--accent-jade); border-radius: 50%; }
  .status-degraded { background: rgba(212, 160, 76, 0.12); color: var(--accent-amber); }
  .status-degraded::before { content: ""; width: 6px; height: 6px; background: var(--accent-amber); border-radius: 50%; }
  .status-draft { background: rgba(212, 160, 76, 0.06); color: var(--accent-amber); border: 1px dashed var(--accent-amber); }
  .status-draft::before { content: ""; width: 6px; height: 6px; border: 1px solid var(--accent-amber); border-radius: 50%; }
  .status-maint { background: var(--bg-soft); color: var(--text-tertiary); }
  .status-maint::before { content: ""; width: 6px; height: 6px; background: var(--text-tertiary); border-radius: 50%; }

  .row-action { color: var(--text-secondary); cursor: pointer; padding: 4px 8px; border-radius: var(--radius-sm); font-size: var(--text-sm); }
  .row-action:hover { background: var(--bg-page); color: var(--text-primary); }

  /* Lower grid */
  .lower-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-4); }
  .panel {
    background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .panel-head {
    padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-subtle);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  .panel-head-left { display: flex; align-items: center; gap: var(--space-2); }
  .panel-title { font-family: var(--font-display); font-size: var(--text-md); font-weight: 700; margin: 0; }
  .panel-tag {
    font-size: 10px; padding: 1px 6px; background: var(--bg-soft); color: var(--text-secondary);
    border-radius: 3px; font-family: var(--font-mono);
  }
  .panel-body { padding: var(--space-3); flex: 1; overflow-y: auto; max-height: 360px; }

  .issue-list, .config-list, .ticket-list { list-style: none; margin: 0; padding: 0; }
  .issue-item {
    padding: var(--space-3); border-radius: var(--radius-md);
    display: flex; gap: var(--space-3); align-items: flex-start; cursor: pointer;
    border: 1px solid transparent;
  }
  .issue-item:hover { background: var(--bg-soft); border-color: var(--border-subtle); }
  .issue-icon {
    width: 26px; height: 26px; border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .issue-icon.severity-error { background: rgba(200, 57, 47, 0.1); color: var(--accent-cinnabar); }
  .issue-icon.severity-warn { background: rgba(212, 160, 76, 0.12); color: var(--accent-amber); }
  .issue-icon.severity-info { background: rgba(45, 63, 90, 0.08); color: var(--accent-ink); }
  .issue-content { flex: 1; min-width: 0; }
  .issue-title { font-size: 13px; color: var(--text-primary); font-weight: 500; margin-bottom: 3px; line-height: 1.4; }
  .issue-meta { font-size: var(--text-xs); color: var(--text-tertiary); display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .issue-meta .meta-key { font-family: var(--font-mono); background: var(--bg-soft); padding: 0 4px; border-radius: 2px; }

  .config-item {
    padding: var(--space-3); border-bottom: 1px dashed var(--border-subtle);
    display: flex; gap: var(--space-3); align-items: flex-start;
  }
  .config-item:last-child { border-bottom: none; }
  .config-time {
    font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-tertiary);
    width: 42px; flex-shrink: 0; padding-top: 2px;
  }
  .config-content { flex: 1; min-width: 0; }
  .config-text { font-size: 13px; color: var(--text-primary); margin-bottom: 4px; line-height: 1.5; }
  .config-text strong { color: var(--accent-ink); font-weight: 600; }
  .config-diff {
    font-family: var(--font-mono); font-size: 11px; background: var(--bg-code);
    padding: 4px 8px; border-radius: var(--radius-sm); color: var(--text-secondary); line-height: 1.6;
  }
  .config-diff .diff-add { color: var(--accent-jade); }
  .config-diff .diff-del { color: var(--accent-rust); }

  .ticket-item {
    padding: var(--space-3); border-bottom: 1px dashed var(--border-subtle);
    display: flex; gap: var(--space-3); align-items: flex-start; cursor: pointer;
  }
  .ticket-item:last-child { border-bottom: none; }
  .ticket-item:hover { background: var(--bg-soft); }
  .ticket-prio { width: 4px; height: 28px; border-radius: 2px; flex-shrink: 0; margin-top: 2px; }
  .ticket-prio-high { background: var(--accent-cinnabar); }
  .ticket-prio-med { background: var(--accent-amber); }
  .ticket-prio-low { background: var(--accent-slate); }
  .ticket-content { flex: 1; min-width: 0; }
  .ticket-head { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; flex-wrap: wrap; }
  .ticket-student { font-weight: 600; color: var(--text-primary); font-size: 13px; }
  .ticket-from {
    font-size: 11px; padding: 1px 6px; background: var(--bg-soft); border-radius: 3px;
    color: var(--text-secondary); border: 1px solid var(--border-subtle); font-family: var(--font-mono);
  }
  .ticket-snippet {
    font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .ticket-meta { font-size: 11px; color: var(--text-tertiary); display: flex; gap: var(--space-2); }
  .ticket-meta .wait-time { color: var(--accent-cinnabar); font-weight: 600; }

  .swatch-1 { background: var(--accent-cinnabar); }
  .swatch-2 { background: #2d5a87; }
  .swatch-3 { background: #6b8e23; }
  .swatch-4 { background: #c8451e; }
  .swatch-5 { background: #5a4a8c; }
  .swatch-6 { background: var(--accent-gold); }
  .swatch-7 { background: var(--accent-jade); }
  .swatch-8 { background: #8b6f47; }
  .swatch-9 { background: #4a7c8c; }
  .swatch-10 { background: #9c4a6a; }

  function cycleStatus(robotId) {
    const r = robots.find(x => x.id === robotId);
    if (!r || r.status === 'draft') return;
    const order = ['online', 'degraded', 'maint', 'online'];
    const next = order[(order.indexOf(r.status) + 1) % (order.length - 1)];
    // 上面写法略 tricky,改成简单版
    const cycle = { online: 'degraded', degraded: 'maint', maint: 'online' };
    r.status = cycle[r.status] || 'online';
    render();
    showToast(`${r.name} 状态已切换为 ${statusLabel(r.status)}`);
  }

  function statusLabel(s) {
    return { online: '在线', degraded: '降级', maint: '维护', draft: '未配置' }[s];

  }

  let _filterText = '';
  function filterRobotsByText(v) {
    _filterText = v.toLowerCase();
    const filtered = (state.filter === 'all' ? robots : robots.filter(r => r.status === state.filter))
      .filter(r => !_filterText || r.name.toLowerCase().includes(_filterText) || r.id.toLowerCase().includes(_filterText));
    document.getElementById('robot-tbody').innerHTML = filtered.map(r => robotRow(r)).join('');
  }

    const isDraft = r.status === 'draft';

    return `

          <div class="robot-cell">

            <div class="robot-info">
              <div class="robot-info-name">${r.name} <span class="robot-info-id">${r.id}</span></div>
              <div class="robot-info-role">${r.role}</div>
            </div>
          </div>
        </td>
        <td><span class="status-pill status-${r.status}" onclick="event.stopPropagation();cycleStatus('${r.id}')">${statusLabel(r.status)}</span></td>
        <td class="col-num" style="${isDraft ? 'color:var(--text-tertiary);' : ''}">${r.templates}</td>
        <td class="col-num" style="${isDraft ? 'color:var(--text-tertiary);' : ''}">${r.keywords}</td>

  function showModal(title, body, onOk) {
    const m = document.getElementById('modal');
    m.innerHTML = `
      <div class="modal-head"><h3 class="modal-title">${title}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
      <div class="modal-body">${body}</div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="window._modalOk()">保存</button>
      </div>`;
    document.getElementById('modal-mask').classList.add('show');
    window._modalOk = () => onOk && onOk();
  }

  function closeModal() {
    document.getElementById('modal-mask').classList.remove('show');
  }

  // ============ Toast ============
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  // ============ Init ============
  document.getElementById('role-switch').addEventListener('click', e => {
    if (e.target.dataset.role) setRole(e.target.dataset.role);
  });
  document.getElementById('modal-mask').addEventListener('click', e => {
    if (e.target.id === 'modal-mask') closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  render();
</script>
</body>
</html>
