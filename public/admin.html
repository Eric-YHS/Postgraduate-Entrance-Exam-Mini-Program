<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理后台｜研途总控台</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .admin-shell {
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: 24px;
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
        min-height: calc(100vh - 48px);
      }
      .admin-nav {
        position: sticky;
        top: 24px;
        height: fit-content;
      }
      .admin-nav .brand-block {
        margin-bottom: 16px;
      }
      .admin-menu {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .admin-menu li {
        margin-bottom: 4px;
      }
      .admin-menu button {
        width: 100%;
        text-align: left;
        padding: 10px 14px;
        border-radius: 12px;
        border: none;
        background: transparent;
        color: var(--text);
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: background 0.15s;
      }
      .admin-menu button:hover {
        background: var(--surface);
      }
      .admin-menu button.active {
        background: var(--brand);
        color: white;
      }
      .admin-menu .menu-icon {
        width: 20px;
        text-align: center;
      }
      .admin-main {
        min-width: 0;
      }
      .admin-section {
        display: none;
      }
      .admin-section.active {
        display: block;
      }
      .admin-section h2 {
        margin-top: 0;
      }
      .sub-nav {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .sub-nav button {
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        cursor: pointer;
      }
      .sub-nav button.active {
        background: var(--brand);
        color: white;
        border-color: var(--brand);
      }
      .placeholder-panel {
        padding: 48px 24px;
        text-align: center;
        color: var(--muted);
      }
      .placeholder-panel .placeholder-mark {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin: 0 auto 16px;
      }
      @media (max-width: 900px) {
        .admin-shell {
          grid-template-columns: 1fr;
        }
        .admin-nav {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <div class="admin-shell">
        <aside class="side-rail admin-nav">
          <section class="brand-block">
            <div class="brand-mark">研</div>
            <h2>管理后台</h2>
            <p class="muted" id="admin-role-hint">超级管理员控制台</p>
            <div class="inline-actions">
              <button class="button" id="logout-button" type="button">退出登录</button>
              <a class="ghost-button" href="/" style="text-decoration: none;">返回首页</a>
            </div>
          </section>
          <nav>
            <ul class="admin-menu" id="admin-menu">
              <!-- 由 admin.js 按角色渲染 -->
            </ul>
          </nav>
        </aside>

        <main class="admin-main">
          <section class="hero" id="admin-hero">
            <span class="hero-badge" id="admin-role-badge">超级管理员</span>
            <h1 id="admin-hero-title">数据看板</h1>
          </section>

          <!-- 1. 数据看板 -->
          <section class="admin-section" id="section-dashboard">
            <h2>运营数据看板</h2>
            <div id="dashboard-grid" class="stat-grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));"></div>
            <div style="margin-top: 24px;">
              <div class="sub-nav" id="dashboard-trend-tabs">
                <button class="active" data-trend="7">最近 7 天</button>
                <button data-trend="30">最近 30 天</button>
              </div>
              <div id="dashboard-trends"></div>
            </div>
          </section>

          <!-- 2. 内容管理 -->
          <section class="admin-section" id="section-content">
            <h2>内容管理</h2>
            <div class="sub-nav" id="content-tabs">
              <button class="active" data-content-type="courses">课程</button>
              <button data-content-type="folder_items">网盘文件</button>
              <button data-content-type="live_sessions">直播</button>
              <button data-content-type="products">商品资料</button>
              <button data-content-type="categories">课程分类</button>
            </div>
            <div id="category-form" class="hidden" style="margin-bottom:16px;padding:12px;background:#f8fafc;border-radius:12px;border:1px solid var(--border);">
              <h3 style="margin-bottom:10px;font-size:14px;">新增/编辑分类</h3>
              <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
                <div>
                  <label style="font-size:12px;color:var(--subtle);">名称</label>
                  <input class="input" id="category-name" placeholder="分类名称" style="padding:6px 10px;font-size:13px;" />
                </div>
                <div>
                  <label style="font-size:12px;color:var(--subtle);">类型</label>
                  <select class="input" id="category-type" style="padding:6px 10px;font-size:13px;">
                    <option value="public">公共课</option>
                    <option value="major">专业课</option>
                  </select>
                </div>
                <div>
                  <label style="font-size:12px;color:var(--subtle);">排序</label>
                  <input class="input" id="category-sort" type="number" value="0" style="padding:6px 10px;font-size:13px;width:80px;" />
                </div>
                <div>
                  <button class="button" id="save-category-btn" type="button" style="font-size:12px;padding:6px 14px;">保存</button>
                  <button class="ghost-button" id="cancel-category-btn" type="button" style="font-size:12px;padding:6px 14px;">取消</button>
                </div>
              </div>
              <input type="hidden" id="category-id" />
            </div>
            <!-- B-14: 商品资料低库存阈值设置 -->
            <div id="product-stock-filter" class="hidden" style="margin-bottom:16px;padding:12px;background:#f8fafc;border-radius:12px;border:1px solid var(--border);">
              <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                <label style="font-size:13px;">低库存阈值：</label>
                <input class="input" id="low-stock-threshold-input" type="number" value="10" min="0" style="padding:6px 10px;font-size:13px;width:80px;" />
                <button class="button" id="apply-low-stock-btn" type="button" style="font-size:12px;padding:6px 14px;">应用</button>
                <span class="muted" style="font-size:12px;">库存低于此值的商品将标红显示</span>
              </div>
            </div>
            <div id="content-list"></div>
          </section>

          <!-- 3. 学员管理 -->
          <section class="admin-section" id="section-students">
            <h2>学员管理</h2>
            <div style="margin-bottom: 16px; display: flex; gap: 12px; flex-wrap: wrap;">
              <input id="student-search" class="input" placeholder="搜索用户名或姓名" style="flex: 1; min-width: 200px;" />
              <select id="student-tier-filter" class="input" style="width: auto;">
                <option value="">全部权益</option>
                <option value="free">免费</option>
                <option value="trial">体验</option>
                <option value="paid">付费</option>
              </select>
            </div>
            <div id="students-list"></div>

            <!-- 学员详情 Modal -->
            <div id="student-detail-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 24px;">
              <div style="background: var(--bg); border-radius: 16px; max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid var(--border);">
                  <h3 id="student-detail-title" style="margin: 0;">学员详情</h3>
                  <button class="ghost-button" id="close-student-detail" type="button" style="font-size: 18px;">&times;</button>
                </div>
                <div id="student-detail-body" style="padding: 24px;">
                  <!-- 由 admin.js 渲染 -->
                </div>
              </div>
            </div>
          </section>

          <!-- 4. 题库管理 -->
          <section class="admin-section" id="section-questions">
            <h2>题库管理</h2>
            <div style="margin-bottom: 16px; padding: 12px; background: #f8fafc; border-radius: 12px; border: 1px solid var(--border);">
              <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end;">
                <div>
                  <label style="font-size: 12px; color: var(--subtle);">科目</label>
                  <select id="question-filter-subject" class="input" style="padding: 6px 10px; font-size: 13px;">
                    <option value="">全部</option>
                    <option value="数学">数学</option>
                    <option value="英语">英语</option>
                    <option value="政治">政治</option>
                    <option value="专业课">专业课</option>
                  </select>
                </div>
                <div>
                  <label style="font-size: 12px; color: var(--subtle);">题型</label>
                  <select id="question-filter-type" class="input" style="padding: 6px 10px; font-size: 13px;">
                    <option value="">全部</option>
                    <option value="choice">单选题</option>
                    <option value="multiple">多选题</option>
                    <option value="word">词汇题</option>
                    <option value="formula">公式题</option>
                    <option value="fill">填空题</option>
                    <option value="essay">主观题</option>
                  </select>
                </div>
                <div>
                  <label style="font-size: 12px; color: var(--subtle);">教材</label>
                  <input id="question-filter-textbook" class="input" placeholder="教材名称" style="padding: 6px 10px; font-size: 13px; width: 120px;" />
                </div>
                <div>
                  <label style="font-size: 12px; color: var(--subtle);">年份</label>
                  <input id="question-filter-year" class="input" placeholder="如 2024" style="padding: 6px 10px; font-size: 13px; width: 80px;" />
                </div>
                <div>
                  <label style="font-size: 12px; color: var(--subtle);">难度</label>
                  <select id="question-filter-difficulty" class="input" style="padding: 6px 10px; font-size: 13px;">
                    <option value="">全部</option>
                    <option value="easy">简单</option>
                    <option value="medium">中等</option>
                    <option value="hard">困难</option>
                  </select>
                </div>
                <div>
                  <label style="font-size: 12px; color: var(--subtle);">付费</label>
                  <select id="question-filter-paid" class="input" style="padding: 6px 10px; font-size: 13px;">
                    <option value="">全部</option>
                    <option value="1">仅付费</option>
                    <option value="0">仅免费</option>
                  </select>
                </div>
                <div>
                  <button class="button" id="apply-question-filter" type="button" style="font-size: 12px; padding: 6px 14px;">筛选</button>
                  <button class="ghost-button" id="reset-question-filter" type="button" style="font-size: 12px; padding: 6px 14px;">重置</button>
                </div>
              </div>
            </div>
            <div id="questions-list"></div>

            <!-- 题目编辑 Modal -->
            <div id="question-edit-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 24px;">
              <div style="background: var(--bg); border-radius: 16px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid var(--border);">
                  <h3 id="question-edit-title" style="margin: 0;">编辑题目</h3>
                  <button class="ghost-button" id="close-question-edit" type="button" style="font-size: 18px;">&times;</button>
                </div>
                <div id="question-edit-body" style="padding: 24px;">
                  <div style="display: grid; gap: 16px;">
                    <label style="display: grid; gap: 6px;">
                      <span>标题</span>
                      <input id="qe-title" class="input" type="text" placeholder="题目标题" />
                    </label>
                    <label style="display: grid; gap: 6px;">
                      <span>解析</span>
                      <textarea id="qe-analysis" class="input" rows="3" placeholder="题目解析"></textarea>
                    </label>
                    <label style="display: grid; gap: 6px;">
                      <span>正确答案</span>
                      <input id="qe-correct" class="input" type="text" placeholder="如 A、B、C" />
                    </label>
                    <label style="display: grid; gap: 6px;">
                      <span>标签（用逗号分隔）</span>
                      <input id="qe-tags" class="input" type="text" placeholder="如 高数,极限,真题" />
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                      <input id="qe-paid" type="checkbox" />
                      <span>仅付费用户可见</span>
                    </label>
                    <input type="hidden" id="qe-id" />
                  </div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 12px; padding: 16px 24px; border-top: 1px solid var(--border);">
                  <button class="ghost-button" id="cancel-question-edit" type="button">取消</button>
                  <button class="button" id="save-question-edit" type="button">保存</button>
                </div>
              </div>
            </div>
          </section>

          <!-- 5. 知识库 / 语料库 -->
          <section class="admin-section" id="section-knowledge">
            <h2>知识库 / 语料库</h2>
            <div class="placeholder-panel">
              <div class="placeholder-mark">🧠</div>
              <p>由 C 线接入</p>
              <p class="muted">AI 知识库、RAG 语料、自动审核语料等。</p>
            </div>
          </section>

          <!-- 6. 消息模板管理 -->
          <section class="admin-section" id="section-messages">
            <h2>消息模板管理</h2>
            <div class="placeholder-panel">
              <div class="placeholder-mark">✉️</div>
              <p>由 C 线接入</p>
              <p class="muted">微信订阅消息模板、督学机器人推送模板。</p>
            </div>
          </section>

          <!-- 7. 论坛管理 -->
          <section class="admin-section" id="section-forum">
            <h2>论坛管理</h2>
            <div class="sub-nav" id="forum-tabs">
              <button class="active" data-forum-tab="topics">帖子</button>
              <button data-forum-tab="replies">回复</button>
              <button data-forum-tab="reports">举报</button>
              <button data-forum-tab="pending">待审核</button>
              <button data-forum-tab="words">敏感词</button>
            </div>
            <div id="forum-list"></div>
            <div id="forum-words-form" style="display:none; margin-top: 16px;"></div>
          </section>

          <!-- 8. 机器人管理 -->
          <section class="admin-section" id="section-robots">
            <h2>机器人管理</h2>
            <div class="placeholder-panel">
              <div class="placeholder-mark">🤖</div>
              <p>由 C 线接入</p>
              <p class="muted">五大机器人、企业微信机器人、督学机器人配置。</p>
            </div>
          </section>

          <!-- 9. 创业板块 -->
          <section class="admin-section" id="section-entrepreneurship">
            <h2>创业板块</h2>
            <div class="placeholder-panel">
              <div class="placeholder-mark">🚀</div>
              <p>由 C 线接入</p>
              <p class="muted">创业宣传、裂变统计、合伙人管理。</p>
            </div>
          </section>

          <!-- 10. 系统设置 -->
          <section class="admin-section" id="section-settings">
            <h2>系统设置</h2>
            <div class="sub-nav" id="settings-tabs">
              <button class="active" data-settings-tab="settings-general">基本配置</button>
              <button data-settings-tab="settings-users">用户管理</button>
              <button data-settings-tab="settings-applications">注册审核</button>
            </div>

            <div id="settings-general" class="settings-tab-panel">
              <div class="paper-card" style="padding: 20px;">
                <h3>站点配置</h3>
                <div id="settings-form" style="display: grid; gap: 16px; max-width: 600px;">
                  <!-- 由 admin.js 渲染 -->
                </div>
                <div style="margin-top: 16px;">
                  <button class="button" id="save-settings-button">保存设置</button>
                </div>
              </div>
            </div>

            <div id="settings-users" class="settings-tab-panel" style="display: none;">
              <div class="paper-card" style="padding: 20px;">
                <h3>用户管理</h3>
                <div style="margin-bottom: 16px; display: flex; gap: 12px; flex-wrap: wrap;">
                  <input id="user-search" class="input" placeholder="搜索用户名或姓名" style="flex: 1; min-width: 200px;" />
                  <select id="user-role-filter" class="input" style="width: auto;">
                    <option value="">全部角色</option>
                    <option value="admin">管理员</option>
                    <option value="teacher">教师</option>
                    <option value="customer_service">客服</option>
                    <option value="student">学生</option>
                  </select>
                </div>
                <div id="users-list"></div>
              </div>
            </div>

            <div id="settings-applications" class="settings-tab-panel" style="display: none;">
              <div class="paper-card" style="padding: 20px;">
                <h3>教师注册审核</h3>
                <div id="applications-list"></div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="/common.js"></script>
    <script src="/admin.js"></script>
  </body>
</html>
